<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뜰담 비밀번호 재설정</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 48px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: #f0fdf4; color: #14532d;
    display: flex; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.06);
  }
  .logo { font-size: 40px; text-align: center; margin-bottom: 8px; }
  h1 { font-size: 1.15rem; text-align: center; margin: 0 0 6px; color: #111827; }
  .sub { font-size: .85rem; color: #6b7280; text-align: center; margin: 0 0 24px; line-height: 1.6; }
  label { display: block; font-size: .8rem; color: #374151; margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; box-sizing: border-box; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 13px 14px; font-size: 1rem; margin-bottom: 14px; outline: none;
  }
  input:focus { border-color: #4ade80; }
  button {
    width: 100%; background: #16a34a; color: #fff; border: 0; border-radius: 14px;
    padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { font-size: .85rem; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; line-height: 1.6; }
  .err { background: #fef2f2; color: #dc2626; }
  .ok  { background: #f0fdf4; color: #15803d; }
  .hide { display: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1210; color: #e8efea; }
    .card { background: #141c18; box-shadow: none; }
    h1 { color: #f1f5f9; } .sub { color: #94a3b8; }
    label { color: #cbd5e1; }
    input { background: #0f1714; border-color: #243029; color: #e8efea; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌿</div>
  <h1>비밀번호 재설정</h1>
  <p class="sub">새로 사용할 비밀번호를 입력해주세요.</p>

  <div id="msg" class="msg hide"></div>

  <div id="formArea">
    <label for="pw1">새 비밀번호</label>
    <input id="pw1" type="password" placeholder="8자 이상" autocomplete="new-password">
    <label for="pw2">새 비밀번호 확인</label>
    <input id="pw2" type="password" placeholder="한 번 더 입력" autocomplete="new-password">
    <button id="submit" type="button">변경하기</button>
  </div>
</div>

<script src="reset.js"></script>
</body>
</html>
